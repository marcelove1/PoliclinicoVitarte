<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <!-- Estilos y fuentes -->
  <defs>
    <style>
      .logo-blue { fill: #004d99; }
      .logo-red { fill: #e51a24; }
      .logo-teal { fill: none; stroke: #00998f; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .logo-white { fill: #ffffff; }
      .text-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #e51a24; }
      .text-vitarte { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 900; fill: #e51a24; letter-spacing: 0.02em; }
    </style>
  </defs>

  <!-- Grupo Estetoscopio Izquierda -->
  <g transform="translate(10, 15)">
    <!-- Auriculares superiores (Azul) -->
    <path d="M 90 70 L 90 55 A 10 10 0 0 1 100 45 L 105 45 A 5 5 0 0 1 110 50 L 110 65 A 5 5 0 0 1 105 70 Z" class="logo-blue" />
    <path d="M 130 70 L 130 50 A 5 5 0 0 1 135 45 L 140 45 A 10 10 0 0 1 150 55 L 150 70 Z" class="logo-blue" />
    
    <!-- Aro del Estetoscopio (Azul) -->
    <path d="M 98 68 C 65 85 55 125 70 160 C 85 195 125 208 160 192 C 195 177 208 135 192 100 C 185 85 174 74 160 67" 
          fill="none" stroke="#004d99" stroke-width="15" stroke-linecap="round" />

    <!-- Cruz Roja Médica Interna -->
    <g transform="translate(85, 85)">
      <!-- Forma de la Cruz -->
      <path d="M 25 0 L 45 0 C 48 0 50 2 50 5 L 50 25 L 70 25 C 73 25 75 27 75 30 L 75 50 C 75 53 73 55 70 55 L 50 55 L 50 75 C 50 78 48 80 45 80 L 25 80 C 22 80 20 78 20 75 L 20 55 L 0 55 C -3 55 -5 53 -5 50 L -5 30 C -5 27 -3 25 0 25 L 20 25 L 20 5 C 20 2 22 0 25 0 Z" 
            class="logo-red" />
      <!-- Línea vertical blanca central -->
      <rect x="30" y="0" width="10" height="80" class="logo-white" rx="2" />
    </g>

    <!-- Conector inferior azul -->
    <rect x="120" y="195" width="20" height="15" rx="3" class="logo-blue" />
  </g>

  <!-- Texto Corporativo Rojo -->
  <!-- "Policlínico" -->
  <text x="210" y="112" class="text-title" font-size="44">Policlínico</text>
  
  <!-- "VITARTE" -->
  <text x="208" y="172" class="text-vitarte" font-size="64">VITARTE</text>

  <!-- Tubo Ondulado Verde Azulado (Teal) -->
  <path d="M 140 216 Q 160 232 230 225 T 380 216 Q 440 220 455 228" class="logo-teal" />

  <!-- Campana / Diafragma Final (Azul) -->
  <circle cx="468" cy="226" r="14" class="logo-blue" />
  <circle cx="468" cy="226" r="6" fill="#003366" />
</svg>
